name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Compiler Crystal Planner Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Vérifier le projet Android
        run: |
          echo "Contenu de la racine :"
          ls -la

          echo "Vérification des fichiers Android..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Compiler l’APK Debug
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Planner-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30